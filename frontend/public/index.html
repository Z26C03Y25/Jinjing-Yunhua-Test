<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>流量威胁检测</title><style>body{background:#101827;color:#eee;font:16px/1.8 system-ui;max-width:1000px;margin:40px auto;padding:20px}button,input{padding:10px;margin:8px}section{background:#19263b;padding:20px;margin:20px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>流量威胁检测系统</h1><p>第一阶段 · 离线 Suricata 检测</p><section><select id="username"><option value="analyst">分析员</option><option value="viewer">只读用户</option></select><input id="password" type="password" placeholder="分析员密码"><button id="login">登录</button><input id="file" type="file" accept=".pcap"><button id="upload">上传检测</button><p id="status">尚未连接</p></section><section><h2>检测任务</h2><button id="refresh">刷新</button><div id="tasks"></div></section><section><h2>告警原始证据</h2><label>源 IP <input id="src"></label><label>严重性 <select id="severity"><option value="">全部</option><option>1</option><option>2</option><option>3</option></select></label><label>状态 <select id="disposition"><option value="">全部</option><option value="new">新</option><option value="confirmed">已确认</option><option value="false_positive">误报</option><option value="ignored">忽略</option></select></label><select id="sort"><option value="time">时间</option><option value="severity">严重性</option></select><button id="filter">筛选</button><button id="prev">上一页</button><button id="next">下一页</button><p id="pages"></p><button id="group">查看当前任务聚合</button><pre id="groups"></pre><div id="alerts">请选择任务</div></section><section><h2>总览</h2><pre id="overview"></pre></section><section><h2>规则管理</h2><p>启停对后续开始执行的任务生效，历史任务保留规则快照。</p><div id="rules"></div></section><script>
let auth='',selectedTask='',page=1,total=0;const el=id=>document.getElementById(id);const status=s=>el('status').textContent=s;
async function api(path,options={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);try{const r=await fetch('/api'+path,{...options,signal:controller.signal,headers:{Authorization:auth,...options.headers}});const data=await r.json();if(!r.ok)throw Error(data.error||r.status);return data}catch(e){if(e.name==='AbortError')throw Error('请求超时，请重试');throw e}finally{clearTimeout(timer)}}
async function tasks(){const rows=await api('/tasks');el('tasks').replaceChildren();if(!rows.length)el('tasks').textContent='暂无任务';for(const row of rows){const p=document.createElement('p');p.textContent=row.id+' · '+row.status+' '+(row.error||'');const b=document.createElement('button');b.textContent='查看告警';b.onclick=()=>{page=1;alerts(row.id).catch(e=>status(e.message))};p.append(b);el('tasks').append(p)}await dashboard()}
async function alerts(id){selectedTask=id;const q=new URLSearchParams({task_id:id,page,size:25,src_ip:el('src').value,severity:el('severity').value,status:el('disposition').value,sort:el('sort').value});const result=await api('/alerts?'+q);const rows=result.items;total=result.total;el('pages').textContent='第 '+page+' 页，共 '+total+' 条';el('alerts').replaceChildren();if(!rows.length)el('alerts').textContent='暂无告警，请确认任务已完成。';for(const row of rows){const d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('pre');s.textContent=row.timestamp+' · '+row.signature+' · '+row.src_ip+':'+row.src_port+' → '+row.dest_ip+':'+row.dest_port;p.textContent='点击下方按钮查看规则、关联流量及审计记录。';const load=document.createElement('button');load.textContent='加载完整详情';load.onclick=async()=>{load.disabled=true;p.textContent='正在查询详情…';try{const detail=await api('/alerts/'+row.id);p.textContent=JSON.stringify(detail,null,2)}catch(e){p.textContent='详情加载失败：'+e.message}finally{load.disabled=false}};d.append(s,load,p);const select=document.createElement('select');for(const [value,label] of [['new','新'],['confirmed','已确认'],['false_positive','误报'],['ignored','忽略']]){const o=document.createElement('option');o.value=value;o.textContent=label;select.append(o)}select.value=row.status;select.onchange=async()=>{try{await api('/alerts/'+row.id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:select.value})});status('处置已记录，重新展开可查看审计记录')}catch(e){status(e.message)}};d.append(select);el('alerts').append(d)}}
el('login').onclick=async()=>{try{auth='Basic '+btoa(el('username').value+':'+el('password').value);await tasks();status('连接成功')}catch(e){status(e.message)}};
el('refresh').onclick=()=>tasks().catch(e=>status(e.message));
el('upload').onclick=async()=>{try{const f=el('file').files[0];if(!f)throw Error('请先选择 PCAP 文件');if(f.size>20*1024*1024)throw Error('文件超过 20 MB');el('upload').disabled=true;const r=await api('/tasks',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:f});status('任务已提交：'+r.id+'，请刷新查看进度');await tasks()}catch(e){status(e.message)}finally{el('upload').disabled=false}};
</script>
<script>
async function dashboard(){el('overview').textContent=JSON.stringify(await api('/overview'),null,2);const rows=await api('/rules');el('rules').replaceChildren();for(const rule of rows){const p=document.createElement('p'),c=document.createElement('input');c.type='checkbox';c.checked=rule.enabled;c.onchange=async()=>{c.disabled=true;try{await api('/rules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid:rule.sid,enabled:c.checked})});status('规则已更新，下次检测生效')}catch(e){c.checked=!c.checked;status(e.message)}finally{c.disabled=false}};p.append(c,document.createTextNode(rule.raw));el('rules').append(p)}}
el('filter').onclick=()=>{page=1;alerts(selectedTask).catch(e=>status(e.message))};el('prev').onclick=()=>{if(page>1){page--;alerts(selectedTask).catch(e=>status(e.message))}};el('next').onclick=()=>{if(page*25<total){page++;alerts(selectedTask).catch(e=>status(e.message))}};
</script>
<script>el('group').onclick=async()=>{try{if(!selectedTask)throw Error('请先选择任务');const r=await api('/groups?task_id='+encodeURIComponent(selectedTask));el('groups').textContent=JSON.stringify(r,null,2)}catch(e){status(e.message)}};</script></html>
