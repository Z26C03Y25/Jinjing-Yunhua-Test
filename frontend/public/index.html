<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>流量威胁检测</title><style>body{background:#101827;color:#eee;font:16px/1.8 system-ui;max-width:1000px;margin:40px auto;padding:20px}button,input{padding:10px;margin:8px}section{background:#19263b;padding:20px;margin:20px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>流量威胁检测系统</h1><p>第一阶段 · 离线 Suricata 检测</p><section><input id="password" type="password" placeholder="分析员密码"><button id="login">登录</button><input id="file" type="file" accept=".pcap"><button id="upload">上传检测</button><p id="status">尚未连接</p></section><section><h2>检测任务</h2><button id="refresh">刷新</button><div id="tasks"></div></section><section><h2>告警原始证据</h2><div id="alerts">请选择任务</div></section><script>
let auth='';const el=id=>document.getElementById(id);const status=s=>el('status').textContent=s;
async function api(path,options={}){const r=await fetch('/api'+path,{...options,headers:{Authorization:auth,...options.headers}});const data=await r.json();if(!r.ok)throw Error(data.error||r.status);return data}
async function tasks(){const rows=await api('/tasks');el('tasks').replaceChildren();if(!rows.length)el('tasks').textContent='暂无任务';for(const row of rows){const p=document.createElement('p');p.textContent=row.id+' · '+row.status+' '+(row.error||'');const b=document.createElement('button');b.textContent='查看告警';b.onclick=()=>alerts(row.id).catch(e=>status(e.message));p.append(b);el('tasks').append(p)}}
async function alerts(id){const rows=await api('/alerts?task='+encodeURIComponent(id));el('alerts').replaceChildren();if(!rows.length)el('alerts').textContent='暂无告警，请确认任务已完成。';for(const row of rows){const d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('pre');s.textContent=row.timestamp+' · '+row.signature+' · '+row.src_ip+':'+row.src_port+' → '+row.dest_ip+':'+row.dest_port;p.textContent=JSON.stringify(JSON.parse(row.raw_json),null,2);d.append(s,p);el('alerts').append(d)}}
el('login').onclick=async()=>{try{auth='Basic '+btoa('analyst:'+el('password').value);await tasks();status('连接成功')}catch(e){status(e.message)}};
el('refresh').onclick=()=>tasks().catch(e=>status(e.message));
el('upload').onclick=async()=>{try{const f=el('file').files[0];if(!f)throw Error('请先选择 PCAP 文件');if(f.size>20*1024*1024)throw Error('文件超过 20 MB');el('upload').disabled=true;const r=await api('/tasks',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:f});status('任务已提交：'+r.id+'，请刷新查看进度');await tasks()}catch(e){status(e.message)}finally{el('upload').disabled=false}};
</script></html>
