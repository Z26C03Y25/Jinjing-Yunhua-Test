name: jinjing-yunhua

services:
  web:
    image: ${WEB_IMAGE:-nginx:1.28.0-alpine}
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-80}:8080"
    networks:
      - edge
      - app
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/public:/usr/share/nginx/html:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Offline Suricata engine and API, no host ports or Docker socket.
  backend:
    image: ${BACKEND_IMAGE:-jinjing-backend:stage1}
    restart: unless-stopped
    networks:
      - app
    volumes:
      - ids-state:/state
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in server .env}
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
    internal: true

volumes:
  ids-state:
